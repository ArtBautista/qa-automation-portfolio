name: QA Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 18 * * *"  # 02:00 Manila time, nightly regression
  workflow_dispatch:

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  BASE_URL: http://127.0.0.1:5000

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check .

  security-tests:
    name: Security tests + ZAP baseline
    needs: api-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Start Content Portal
        run: bash scripts/start_app.sh
      - name: Run security tests
        run: >
          pytest tests/security
          --junitxml=reports/security-junit.xml
          --html=reports/security-report.html --self-contained-html
      - name: OWASP ZAP baseline scan
        run: |
          mkdir -p zap
          cp .zap/rules.tsv zap/rules.tsv
          chmod -R 777 zap
          docker run --rm --network host -v "${{ github.workspace }}/zap:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t http://127.0.0.1:5000 -c rules.tsv -r zap-report.html -J zap-report.json -I
      - name: Job summary
        if: always()
        run: python scripts/junit_summary.py reports/security-junit.xml >> "$GITHUB_STEP_SUMMARY"
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            reports/
            zap/

  api-tests:
    name: API tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Start Content Portal
        run: bash scripts/start_app.sh
      - name: Run API tests
        run: >
          pytest tests/api
          --junitxml=reports/api-junit.xml
          --html=reports/api-report.html --self-contained-html
      - name: Job summary
        if: always()
        run: python scripts/junit_summary.py reports/api-junit.xml >> "$GITHUB_STEP_SUMMARY"
      - name: Upload API report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-report
          path: reports/

  ui-tests:
    name: UI tests (${{ matrix.browser }})
    needs: api-tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Start Content Portal
        run: bash scripts/start_app.sh
      - name: Run UI tests
        run: >
          pytest tests/ui -m "not drupal"
          --browser ${{ matrix.browser }} --headless
          --junitxml=reports/ui-${{ matrix.browser }}-junit.xml
          --html=reports/ui-${{ matrix.browser }}-report.html --self-contained-html
      - name: Job summary
        if: always()
        run: >
          python scripts/junit_summary.py reports/ui-${{ matrix.browser }}-junit.xml
          >> "$GITHUB_STEP_SUMMARY"
      - name: Upload UI report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-report-${{ matrix.browser }}
          path: reports/

  performance-smoke:
    name: Performance smoke (Locust)
    needs: api-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Start Content Portal (waitress)
        run: bash scripts/start_app.sh waitress
      - name: Run Locust (20 users, 45 s)
        run: >
          locust -f perf/locustfile.py --headless
          --users 20 --spawn-rate 5 --run-time 45s
          --host "$BASE_URL"
          --csv reports/perf --html reports/perf-report.html
          --exit-code-on-error 0 --only-summary
      - name: Check performance budget
        run: >
          python perf/check_thresholds.py reports/perf_stats.csv
          --p95-ms 500 --endpoint-p95-ms 500 --max-failure-ratio 0.01
      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-report
          path: reports/