[pytest]
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers
markers =
    smoke: critical-path checks that run on every commit
    api: REST API tests
    ui: browser tests with Selenium
    security: basic security checks
    a11y: accessibility checks with axe-core
    drupal: tests that need a running Drupal site (set DRUPAL_URL)