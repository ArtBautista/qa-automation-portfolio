# GitLab CI version of the pipeline. Copy to the repository root as .gitlab-ci.yml to use it.
stages:
  - lint
  - test
  - security
  - performance

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  BASE_URL: "http://127.0.0.1:5000"

default:
  image: python:3.11-bookworm
  cache:
    key: pip-cache
    paths:
      - .cache/pip
  before_script:
    - pip install -r requirements.txt

lint:
  stage: lint
  script:
    - ruff check .

api_tests:
  stage: test
  script:
    - bash scripts/start_app.sh
    - pytest tests/api --junitxml=reports/api-junit.xml
  artifacts:
    when: always
    paths: [reports/]
    reports:
      junit: reports/api-junit.xml

ui_tests:
  stage: test
  variables:
    CHROME_BINARY: /usr/bin/chromium
    CHROMEDRIVER_PATH: /usr/bin/chromedriver
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends chromium chromium-driver
    - pip install -r requirements.txt
  script:
    - bash scripts/start_app.sh
    - >
      pytest tests/ui -m "not drupal" --browser chrome --headless
      --junitxml=reports/ui-junit.xml --html=reports/ui-report.html --self-contained-html
  artifacts:
    when: always
    paths: [reports/]
    reports:
      junit: reports/ui-junit.xml

security_tests:
  stage: security
  script:
    - bash scripts/start_app.sh
    - pytest tests/security --junitxml=reports/security-junit.xml
  artifacts:
    when: always
    paths: [reports/]
    reports:
      junit: reports/security-junit.xml

performance_smoke:
  stage: performance
  script:
    - bash scripts/start_app.sh waitress
    - >
      locust -f perf/locustfile.py --headless -u 20 -r 5 -t 45s --host "$BASE_URL"
      --csv reports/perf --exit-code-on-error 0 --only-summary
    - >
      python perf/check_thresholds.py reports/perf_stats.csv
      --p95-ms 500 --endpoint-p95-ms 500 --max-failure-ratio 0.01
  artifacts:
    when: always
    paths: [reports/]