# Local Drupal 10 for practice. Start: docker compose -f drupal/docker-compose.yml up -d
# Then open http://localhost:8080 and run the installer (database host: db).
services:
  drupal:
    image: drupal:10-apache
    ports:
      - "8080:80"
    depends_on:
      - db
    volumes:
      - drupal_sites:/var/www/html/sites
    restart: unless-stopped
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: drupal
      POSTGRES_USER: drupal
      POSTGRES_PASSWORD: drupal
    volumes:
      - drupal_db:/var/lib/postgresql/data
    restart: unless-stopped
volumes:
  drupal_sites:
  drupal_db:
